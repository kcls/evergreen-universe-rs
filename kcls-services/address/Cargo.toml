[package]
name = "kcls-service-address"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
evergreen = { path = "../../evergreen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.22"
rand = "0.8.5"
reqwest = { version = "0.12", features = ["blocking"] }
geo = "0.30.0"
shapefile = {version = "0.7.0", features = ["geo-types"]}

[[bin]]
name = "kcls-service-address"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0.140"


